// SHA-256 em JavaScript puro (funciona também fora de HTTPS). Entrada: texto ASCII.
function sha256(ascii) {
  const rr = (v, n) => (v >>> n) | (v << (32 - n));
  const maxWord = 2 ** 32, H = [], K = [], comp = {};
  for (let c = 2, n = 0; n < 64; c++) {
    if (!comp[c]) {
      for (let i = 0; i < 313; i += c) comp[i] = c;
      H[n] = (c ** 0.5 * maxWord) | 0;
      K[n++] = (c ** (1 / 3) * maxWord) | 0;
    }
  }
  const bitLen = ascii.length * 8;
  ascii += "\x80";
  while (ascii.length % 64 - 56) ascii += "\x00";
  const words = [];
  for (let i = 0; i < ascii.length; i++) words[i >> 2] |= ascii.charCodeAt(i) << ((3 - i) % 4) * 8;
  words.push((bitLen / maxWord) | 0, bitLen);
  let hash = H.slice(0, 8);
  for (let j = 0; j < words.length;) {
    const w = words.slice(j, j += 16), old = hash;
    hash = hash.slice(0, 8);
    for (let i = 0; i < 64; i++) {
      const w15 = w[i - 15], w2 = w[i - 2], a = hash[0], e = hash[4];
      const t1 = hash[7] + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & hash[5]) ^ (~e & hash[6])) + K[i]
        + (w[i] = i < 16 ? w[i] : (w[i - 16] + (rr(w15, 7) ^ rr(w15, 18) ^ (w15 >>> 3)) + w[i - 7]
          + (rr(w2, 17) ^ rr(w2, 19) ^ (w2 >>> 10))) | 0);
      const t2 = (rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
      hash = [(t1 + t2) | 0].concat(hash);
      hash[4] = (hash[4] + t1) | 0;
    }
    for (let i = 0; i < 8; i++) hash[i] = (hash[i] + old[i]) | 0;
  }
  return hash.slice(0, 8).map(h => (h >>> 0).toString(16).padStart(8, "0")).join("");
}

const euros = v => new Intl.NumberFormat("pt-PT", { style: "currency", currency: "EUR",
  maximumFractionDigits: Number.isInteger(v) ? 0 : 2 }).format(v);
const normalizar = s => s.toUpperCase().replace(/[^A-Z0-9]/g, "");
const formatar = s => s.match(/.{1,2}/g)?.join("-") ?? "";

const input = document.getElementById("mat");
const resultado = document.getElementById("resultado");
const ICONE_ERRO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5v.01"/></svg>';

// Esconde "Em vigor" e as regras se o Excel não as tiver; parte as regras em lista.
const vigor = document.querySelector("#vigor strong");
if (!vigor.textContent.trim()) vigor.parentElement.hidden = true;
const ul = document.querySelector("[data-regras]");
const regras = ul.dataset.regras.split(/\s*[·•;]\s*/).map(s => s.replace(/\.$/, "").trim()).filter(Boolean)
  .filter(s => !/^limites em n[úu]mero/i.test(s)); // não mostrar esta regra
if (regras.length) regras.forEach(r => ul.append(el("li", "", r)));
else document.getElementById("regras").hidden = true;

function el(tag, cls, texto) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (texto !== undefined) e.textContent = texto;
  return e;
}

function bloco(cls, rotulo, texto) {
  const d = el("div", cls);
  d.append(el("span", "", rotulo), el("b", "", texto));
  return d;
}

function erro(texto) {
  const d = el("div", "erro");
  d.innerHTML = ICONE_ERRO;
  d.append(el("div", "", texto));
  resultado.append(d);
}

function mostrar(mat) {
  resultado.replaceChildren();
  if (mat.length !== 6) return erro("A matrícula deve ter 6 letras/números (ex.: 00-AA-00).");
  const i = DADOS.m[sha256(mat)];
  if (i === undefined) {
    return erro("Matrícula " + formatar(mat) + " não encontrada. Confirme a matrícula ou contacte a gestão de frota.");
  }
  const [categoria, tipo, mensal, diario, nDia, porAbast, combustiveis] = DADOS.p[i];
  const cartao = el("div", "cartao");

  const topo = el("div", "topo");
  const info = el("div", "info");
  info.append(el("div", "categoria", categoria), el("div", "tipo", tipo));
  topo.append(el("div", "mini-placa", formatar(mat)), info);

  const destaques = el("div", "destaques");
  destaques.append(bloco("destaque", "Limite mensal", euros(mensal)), bloco("destaque", "Limite diário", euros(diario)));

  const itens = el("div", "itens");
  itens.append(bloco("item", "Abastecimentos por dia", String(nDia)), bloco("item", "Limite por abastecimento", euros(porAbast)));

  const comb = el("div", "comb");
  const chips = el("div", "chips");
  combustiveis.split(/\s*(?:[,;/+]|\se\s)\s*/).filter(Boolean).forEach(c => chips.append(el("span", "chip", c)));
  comb.append(el("span", "", "Combustíveis permitidos"), chips);

  cartao.append(topo, destaques, itens, comb);
  resultado.append(cartao);
}

input.addEventListener("input", () => {
  input.value = formatar(normalizar(input.value).slice(0, 6));
});

document.getElementById("form").addEventListener("submit", ev => {
  ev.preventDefault();
  mostrar(normalizar(input.value));
  input.blur(); // fecha o teclado do telemóvel para mostrar o resultado
  resultado.scrollIntoView({ behavior: "smooth", block: "nearest" });
});
</script>
