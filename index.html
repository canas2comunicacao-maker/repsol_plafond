<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Consulta de Plafond</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1c1f24;
    --muted: #5d6470;
    --line: #dfe2e7;
    --accent: #e8590c;
    --accent-text: #ffffff;
    --ok-bg: #fff4ec;
    --err: #b42318;
    --err-bg: #fdecea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121417;
      --card: #1c1f24;
      --text: #eceef1;
      --muted: #a2a9b4;
      --line: #2f343b;
      --accent: #ff7a2e;
      --accent-text: #1a0d04;
      --ok-bg: #2a1d14;
      --err: #ff8a80;
      --err-bg: #3a1c1a;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main {
    max-width: 560px; margin: 0 auto;
    padding: 24px max(16px, env(safe-area-inset-right)) 40px max(16px, env(safe-area-inset-left));
  }
  h1 { font-size: clamp(1.1rem, 4.6vw, 1.35rem); margin: 0 0 4px; overflow-wrap: anywhere; }
  .vigor { color: var(--muted); margin: 0 0 20px; font-size: .95rem; }
  .vigor strong { color: var(--text); }
  form {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 18px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px;
  }
  label { font-weight: 600; }
  .linha { display: flex; gap: 8px; }
  input {
    flex: 1; width: 0; min-width: 0; font: inherit; font-size: 1.4rem; letter-spacing: .08em;
    text-transform: uppercase; text-align: center; padding: 10px 12px;
    border: 2px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--text);
  }
  input:focus { outline: none; border-color: var(--accent); }
  button {
    font: inherit; font-weight: 600; padding: 0 18px; min-height: 48px; border: 0; border-radius: 10px;
    background: var(--accent); color: var(--accent-text); cursor: pointer;
    touch-action: manipulation;
  }
  .ajuda { color: var(--muted); font-size: .85rem; margin: 0; }
  #resultado { margin-top: 18px; }
  .cartao {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
  }
  .topo { background: var(--ok-bg); padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .matricula { font-size: 1.5rem; font-weight: 700; letter-spacing: .08em; }
  .tipo { color: var(--muted); font-size: .9rem; }
  .grelha { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .valor { padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .valor:nth-child(odd) { border-right: 1px solid var(--line); }
  .valor span { display: block; color: var(--muted); font-size: .82rem; }
  .valor b { font-size: 1.35rem; }
  .valor.destaque b { color: var(--accent); font-size: 1.6rem; }
  .comb { padding: 14px 18px; }
  .comb span { display: block; color: var(--muted); font-size: .82rem; }
  .erro {
    background: var(--err-bg); color: var(--err); border-radius: 12px; padding: 14px 18px;
  }
  .regras { color: var(--muted); font-size: .85rem; margin-top: 22px; }
  /* Ecrãs estreitos: botão por baixo da caixa, a toda a largura. */
  @media (max-width: 380px) {
    main { padding-top: 16px; }
    form { padding: 14px; }
    .linha { flex-direction: column; }
    input { width: 100%; }
    .valor, .topo, .comb { padding: 12px 14px; }
    .valor b { font-size: 1.2rem; }
    .valor.destaque b { font-size: 1.4rem; }
  }
</style>
</head>
<body>
<main>
  <h1>Cartões de Combustível CANAS/REPSOL – Limites por matrícula</h1>
  <p class="vigor">Em vigor a partir de <strong>09/10/2026</strong></p>

  <form id="form" autocomplete="off">
    <label for="mat">Matrícula da viatura</label>
    <div class="linha">
      <input id="mat" name="mat" placeholder="00-AA-00" maxlength="8" inputmode="text"
             autocapitalize="characters" autocorrect="off" enterkeyhint="search" spellcheck="false" required>
      <button type="submit">Consultar</button>
    </div>
    <p class="ajuda">Pode escrever com ou sem hífenes (ex.: 00AA00).</p>
  </form>

  <div id="resultado" aria-live="polite"></div>

  <p class="regras">Regras comuns: pagamento em loja não permitido · abastecimentos permitidos todos os dias · limites em número e em Euros.</p>
</main>

// SHA-256 em JavaScript puro (funciona também fora de HTTPS). Entrada: texto ASCII.
function sha256(ascii) {
  const rr = (v, n) => (v >>> n) | (v << (32 - n));
  const maxWord = 2 ** 32, H = [], K = [], comp = {};
  for (let c = 2, n = 0; n < 64; c++) {
    if (!comp[c]) {
      for (let i = 0; i < 313; i += c) comp[i] = c;
      H[n] = (c ** 0.5 * maxWord) | 0;
      K[n++] = (c ** (1 / 3) * maxWord) | 0;
    }
  }
  const bitLen = ascii.length * 8;
  ascii += "\x80";
  while (ascii.length % 64 - 56) ascii += "\x00";
  const words = [];
  for (let i = 0; i < ascii.length; i++) words[i >> 2] |= ascii.charCodeAt(i) << ((3 - i) % 4) * 8;
  words.push((bitLen / maxWord) | 0, bitLen);
  let hash = H.slice(0, 8);
  for (let j = 0; j < words.length;) {
    const w = words.slice(j, j += 16), old = hash;
    hash = hash.slice(0, 8);
    for (let i = 0; i < 64; i++) {
      const w15 = w[i - 15], w2 = w[i - 2], a = hash[0], e = hash[4];
      const t1 = hash[7] + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & hash[5]) ^ (~e & hash[6])) + K[i]
        + (w[i] = i < 16 ? w[i] : (w[i - 16] + (rr(w15, 7) ^ rr(w15, 18) ^ (w15 >>> 3)) + w[i - 7]
          + (rr(w2, 17) ^ rr(w2, 19) ^ (w2 >>> 10))) | 0);
      const t2 = (rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
      hash = [(t1 + t2) | 0].concat(hash);
      hash[4] = (hash[4] + t1) | 0;
    }
    for (let i = 0; i < 8; i++) hash[i] = (hash[i] + old[i]) | 0;
  }
  return hash.slice(0, 8).map(h => (h >>> 0).toString(16).padStart(8, "0")).join("");
}

const euros = v => new Intl.NumberFormat("pt-PT", { style: "currency", currency: "EUR",
  maximumFractionDigits: Number.isInteger(v) ? 0 : 2 }).format(v);
const normalizar = s => s.toUpperCase().replace(/[^A-Z0-9]/g, "");
const formatar = s => s.match(/.{1,2}/g)?.join("-") ?? "";

const input = document.getElementById("mat");
const resultado = document.getElementById("resultado");

function el(tag, cls, texto) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (texto !== undefined) e.textContent = texto;
  return e;
}

function valor(rotulo, texto, destaque) {
  const d = el("div", destaque ? "valor destaque" : "valor");
  d.append(el("span", "", rotulo), el("b", "", texto));
  return d;
}

function mostrar(mat) {
  resultado.replaceChildren();
  if (mat.length !== 6) {
    resultado.append(el("div", "erro", "A matrícula deve ter 6 letras/números (ex.: 00-AA-00)."));
    return;
  }
  const i = DADOS.m[sha256(mat)];
  if (i === undefined) {
    resultado.append(el("div", "erro",
      "Matrícula " + formatar(mat) + " não encontrada. Confirme a matrícula ou contacte a gestão de frota."));
    return;
  }
  const [categoria, tipo, mensal, diario, nDia, porAbast, combustiveis] = DADOS.p[i];
  const cartao = el("div", "cartao");
  const topo = el("div", "topo");
  topo.append(el("div", "matricula", formatar(mat)), el("div", "tipo", categoria + " · " + tipo));
  const grelha = el("div", "grelha");
  grelha.append(
    valor("Limite mensal", euros(mensal), true),
    valor("Limite diário", euros(diario), true),
    valor("Abastecimentos por dia", String(nDia)),
    valor("Limite por abastecimento", euros(porAbast)),
  );
  const comb = el("div", "comb");
  comb.append(el("span", "", "Combustíveis permitidos"), el("b", "", combustiveis));
  cartao.append(topo, grelha, comb);
  resultado.append(cartao);
}

input.addEventListener("input", () => {
  const n = normalizar(input.value).slice(0, 6);
  input.value = formatar(n);
});

document.getElementById("form").addEventListener("submit", ev => {
  ev.preventDefault();
  mostrar(normalizar(input.value));
  input.blur(); // fecha o teclado do telemóvel para mostrar o resultado
  resultado.scrollIntoView({ behavior: "smooth", block: "nearest" });
});
</script>
